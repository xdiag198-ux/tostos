name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверка секретов
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Добавьте секреты SUPABASE_URL и SUPABASE_PUBLISHABLE_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: oven-sh/setup-bun@v2

      - name: Установка зависимостей
        run: bun install

      - name: Проверка пуш-уведомлений
        run: |
          if [ -f google-services.json ]; then
            echo "VITE_PUSH_ENABLED=true" >> "$GITHUB_ENV"
            echo "google-services.json найден, пуши будут включены"
          else
            echo "::warning::Нет google-services.json: пуши выключены, приложение не будет просить разрешение на уведомления."
          fi

      - name: Сборка сайта (SPA)
        run: npm run build:mobile

      - name: Веб-версия (для iPhone и браузера)
        uses: actions/upload-artifact@v4
        with:
          name: tosto-web
          path: dist/client
          if-no-files-found: error

      - name: Создание Android-проекта
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          node scripts/patch-android.mjs
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "google-services.json подключён, пуш-уведомления включены"
          else
            echo "::warning::Нет google-services.json в корне репозитория, пуш-уведомления в этой сборке работать не будут."
          fi

      - name: Иконка и заставка
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android

      - name: Синхронизация с Android
        run: npx cap sync android

      - name: Сборка APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Собираю подписанный release-APK"
            ./gradlew assembleRelease --no-daemon
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tosto.jks"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
            "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/tosto.jks" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              --out ../tosto.apk "$RUNNER_TEMP/aligned.apk"
          else
            echo "Ключа подписи нет, собираю debug-APK"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../tosto.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tosto-apk
          path: tosto.apk
          if-no-files-found: error
